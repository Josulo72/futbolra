<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="100%" stop-color="#12121a"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="50%" stop-color="#FFA500"/>
      <stop offset="100%" stop-color="#FF8C00"/>
    </linearGradient>
    <linearGradient id="ballGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#FFA500"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background circle -->
  <circle cx="48" cy="48" r="46" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="2"/>
  
  <!-- Outer ring -->
  <circle cx="48" cy="48" r="38" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.6"/>
  
  <!-- Inner ring -->
  <circle cx="48" cy="48" r="28" fill="none" stroke="url(#goldGrad)" stroke-width="1" opacity="0.4"/>
  
  <!-- Football ball -->
  <circle cx="48" cy="48" r="22" fill="url(#ballGrad)" filter="url(#glow)"/>
  
  <!-- Pentagon patches -->
  <g fill="#0a0a0f" opacity="0.9">
    <polygon points="48,28 54,34 48,40 42,34"/>
    <polygon points="34,40 40,46 34,52 28,46"/>
    <polygon points="62,40 68,46 62,52 56,46"/>
    <polygon points="48,56 54,62 48,68 42,62"/>
    <polygon points="34,48 40,54 34,60 28,54"/>
    <polygon points="62,48 68,54 62,60 56,54"/>
  </g>
  
  <!-- Central hexagon -->
  <polygon points="48,38 54,42 54,50 48,54 42,50 42,42" fill="#0a0a0f" opacity="0.9"/>
  
  <!-- Crown accent on top -->
  <g fill="url(#goldGrad)">
    <path d="M48,10 L51,16 L48,13 L45,16 Z" opacity="0.9"/>
    <path d="M43,14 L45,20 L42,17 L39,20 Z" opacity="0.7"/>
    <path d="M53,14 L55,20 L52,17 L49,20 Z" opacity="0.7"/>
  </g>
  
  <!-- Subtle shine on ball -->
  <ellipse cx="40" cy="40" rx="8" ry="4" fill="url(#goldGrad)" opacity="0.15"/>
</svg>